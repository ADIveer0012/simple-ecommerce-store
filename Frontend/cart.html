<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Simple E-Commerce Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Simple E-Commerce Store - Cart</h1>
  <nav id="nav-links" style="display:flex; gap:20px; font-size:16px; align-items:center;"></nav>
</header>

<main>
  <h2 style="text-align:center; margin-top:20px;">Your Cart</h2>

  <div id="cart">
    <!-- Cart items load here -->
  </div>

  <p class="total" id="total"></p>

  <div style="text-align:center; margin-top:20px;">
    <button onclick="checkout()">Place Order</button>
  </div>
</main>

<!-- API address (must load before app.js) -->
<script src="js/config.js"></script>

<!-- Store logic: cart, checkout, nav -->
<script src="js/app.js"></script>
</body>
</html>
