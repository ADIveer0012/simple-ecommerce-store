<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | E-Commerce</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <h2>Create Account 👋</h2>
    <p>Sign up to start shopping</p>

    <form id="register-form">
      <input id="name" type="text" placeholder="Full Name" autocomplete="name" minlength="2" maxlength="60" required>
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (min 6 characters)" autocomplete="new-password" minlength="6" required>
      <input id="confirm" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
      <p id="form-message" style="color:#dc2626; font-size:14px; min-height:20px;"></p>
      <button type="submit">Register</button>
    </form>

    <span style="display:block; margin-top:15px; text-align:center;">
      Already have an account? <a href="login.html" style="color:#2563eb; font-weight:500;">Login</a>
    </span>
  </div>

  <!-- API address (must load before auth.js) -->
  <script src="js/config.js"></script>

  <!-- Register logic -->
  <script src="js/auth.js"></script>
</body>
</html>
