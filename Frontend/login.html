<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | E-Commerce</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <h2>Welcome Back 👋</h2>
    <p>Login to continue shopping</p>

    <form id="login-form">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <p id="form-message" style="color:#dc2626; font-size:14px; min-height:20px;"></p>
      <button type="submit">Login</button>
    </form>

    <span style="display:block; margin-top:15px; text-align:center;">
      Don’t have an account? <a href="register.html" style="color:#2563eb; font-weight:500;">Register</a>
    </span>
  </div>

  <!-- API address (must load before auth.js) -->
  <script src="js/config.js"></script>

  <!-- Login logic -->
  <script src="js/auth.js"></script>
</body>
</html>
